<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>库存管理系统</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<h2>库存查询</h2>
<input type="text" id="searchInput" placeholder="输入编号">
<div id="inventoryList"></div>

<hr>

<div id="adminSection" style="display:none;">

<h3>Excel 导入（覆盖）</h3>
<input type="file" id="excelFile">

<h3>入库</h3>
<input id="inCode" placeholder="编号">
<input id="inSpec" placeholder="规格">
<input id="inColor" placeholder="色号">
<input id="inWarehouse" placeholder="仓库">
<input id="inQty" type="number" placeholder="数量">
<button id="btnIn">入库</button>

<h3>出库</h3>
<input id="outCode" placeholder="编号">
<input id="outWarehouse" placeholder="仓库">
<input id="outQty" type="number" placeholder="数量">
<input id="outCustomer" placeholder="客户">
<select id="paid">
<option value="true">已付款</option>
<option value="false">未付款</option>
</select>
<button id="btnOut">出库</button>

<h3>留货</h3>
<input id="resCode" placeholder="编号">
<input id="resWarehouse" placeholder="仓库">
<input id="resQty" type="number" placeholder="数量">
<input id="resCustomer" placeholder="客户">
<button id="btnReserve">留货</button>

<h3>日志</h3>
<button id="btnCSV">下载CSV</button>
<div id="logList"></div>

</div>

<hr>

<h3>管理员登录</h3>
<input id="email" placeholder="邮箱">
<input id="password" type="password" placeholder="密码">
<button id="btnLogin">登录</button>
<button id="btnLogout">退出</button>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script type="module" src="js/main.js"></script>

</body>
</html>
