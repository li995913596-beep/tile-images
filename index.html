<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>瓷砖库存查询系统 / Tile Inventory System</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
  <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
    <button type="button" onclick="location.href='transit.html'"
      style="padding:6px 12px;border:none;border-radius:8px;background:#2563eb;color:#fff;font-size:13px;font-weight:600;cursor:pointer;">
      在途货物
    </button>
    <span>瓷砖库存查询系统 / Tile Inventory</span>
  </div>
  <div style="display:flex;align-items:center;gap:14px;">
    <div class="gear" title="卖货分析" onclick="location.href='report.html'" style="opacity:0.55;font-size:16px;">📊</div>
    <div class="gear" onclick="location.href='admin.html'">⚙</div>
  </div>
</header>

<div class="container">

  <div class="search-box">
    <h2>库存查询 / Inventory Search</h2>

    <div class="search-row">
      <input 
        id="searchInput" 
        placeholder="输入编号或规格 / Enter Code or Size">
    </div>

    <div class="search-buttons">
      <button id="btnSearch">查询 / Search</button>
      <button id="btnRefresh">刷新 / Reset</button>
    </div>

  </div>

  <div id="result"></div>

</div>

<!-- 图片放大 -->
<div id="imgModal" class="modal">
  <img id="modalImg">
</div>

<script type="module" src="js/query.js?v=20260811a"></script>

<script>
const modal=document.getElementById("imgModal");
const modalImg=document.getElementById("modalImg");

window.openModal=function(src){
  modal.style.display="flex";
  modalImg.src=src;
};

modal.onclick=function(){
  modal.style.display="none";
};
</script>

</body>
</html>
