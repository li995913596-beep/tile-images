<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>库存管理后台</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
  库存管理后台
  <div style="cursor:pointer" onclick="location.href='index.html'">🏠</div>
</header>

<div class="container">

<!-- 登录 -->
<div id="loginSection" class="card">
  <h2>管理员登录</h2>
  <input id="email" placeholder="邮箱">
  <input id="password" type="password" placeholder="密码">
  <button id="btnLogin">登录</button>
</div>

<!-- 后台 -->
<div id="adminSection" style="display:none;">

  <div class="card nav-card">
    <button onclick="showTab('in')">入库</button>
    <button onclick="showTab('out')">出库</button>
    <button onclick="showTab('reserve')">留货</button>
    <button onclick="showTab('log')">日志</button>
    <button onclick="showTab('stats')">统计</button>
    <button id="btnLogout">退出</button>
  </div>

  <!-- 🔥 Excel 导入 -->
  <div class="card">
    <h3>导入库存（Excel）</h3>
    <input type="file" id="excelFile" accept=".xlsx,.xls">
    <button onclick="handleImport()">导入</button>
  </div>

  <div id="tab_in" class="tab card"></div>
  <div id="tab_out" class="tab card" style="display:none;"></div>
  <div id="tab_reserve" class="tab card" style="display:none;"></div>
  <div id="tab_log" class="tab card" style="display:none;"></div>
  <div id="tab_stats" class="tab card" style="display:none;"></div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script type="module" src="js/admin.js"></script>

</body>
</html>
