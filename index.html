<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>瓷砖库存查询系统</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  瓷砖库存查询系统
  <div class="gear" onclick="location.href='admin.html'">⚙</div>
</header>

<div class="container">

  <div class="search-box">
    <h2>库存查询</h2>

    <div class="search-row">
      <input id="searchInput" placeholder="输入编号或色号">
      <button id="btnSearch" class="btn-primary">查询</button>
      <button id="btnRefresh" class="btn-gray">刷新</button>
    </div>

    <div class="update" id="updateTime">库存最后更新时间： --</div>
  </div>

  <div id="result"></div>

</div>

<!-- 图片放大层 -->
<div id="imgModal" class="modal" onclick="closeModal()">
  < img id="modalImg">
</div>

<script type="module" src="js/query.js"></script>

<script>
function openModal(src){
  document.getElementById("modalImg").src = src;
  document.getElementById("imgModal").style.display = "flex";
}

function closeModal(){
  document.getElementById("imgModal").style.display = "none";
}
</script>

</body>
</html>
