<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>库存查询</title>
<link rel="stylesheet" href="css/style.css?v=20261106a">
</head>
<body>
<div class="container">
  <div class="search-box">
    <div class="search-row">
      <input id="searchInput" placeholder="编号或规格">
      <button type="button" id="btnSearch"><span>查询</span></button>
    </div>
  </div>
  <div id="sub" style="font-size:12px;color:#94a3b8;margin:-4px 2px 10px;">库存时间 <span id="when">—</span> · 只查询，不是实时库存</div>
  <div id="result"></div>
</div>
<div id="imgModal" class="modal"><img id="modalImg"></div>
<script src="js/sales_data.js?v=202611060131"></script>
<script>
document.getElementById("when").textContent = window.SALES_UPDATED_AT || "—";
function esc(s){return String(s==null?"":s).replace(/[&<>]/g,function(c){return {"&":"&","<":"<",">":">"}[c];});}
function normalizeSpec(s){
  s=String(s==null?"":s).trim();
  if(!s) return "";
  s=s.replace(/[＊×✕✖*]/g,"x").replace(/X/g,"x").replace(/\s+/g,"");
  var parts=s.split("x").filter(function(p){return p!=="";});
  return parts.length>=2?parts[0]+"x"+parts[1]:s;
}
function packLine(item){
  var parts=[];
  if(Number(item.piecesPerBox)>0) parts.push(Number(item.piecesPerBox)+"片/箱");
  if(Number(item.boxWeight)>0) parts.push(Number(item.boxWeight)+"kg");
  if(item.packaging) parts.push(item.packaging);
  return parts.join(" · ");
}
function render(list){
  var resultDiv=document.getElementById("result");
  if(!list.length){resultDiv.innerHTML="<div style='padding:16px;color:#94a3b8;'>未找到库存</div>";return;}
  var desktop=window.innerWidth>=768;
  if(desktop){
    var html='<div class="result-table"><div class="result-header"><div>图片</div><div>编号</div><div>规格</div><div>色号</div><div>库存</div><div>留货</div><div>仓库</div></div>';
    list.forEach(function(item){
      var imageUrl=location.origin+"/images/"+encodeURIComponent(item.code||"")+".jpg";
      var stockColor=item.stock>10?"#2ecc71":item.stock>0?"#f39c12":"#e74c3c";
      var pack=packLine(item);
      var reserveHtml=item.reserved>0?(item.reserved+(item.reserveDetail?"<br><span style=\"font-size:12px;color:#c0392b;\">"+esc(item.reserveDetail)+"</span>":"")):"0";
      html+='<div class="result-row"><div onclick="openModal(\''+imageUrl+'\')"><img src="'+imageUrl+'" style="width:50px;height:50px;border-radius:6px;object-fit:cover;" onerror="this.style.display=\'none\'"></div>'+
        '<div>'+esc(item.code)+(pack?'<div style="font-size:11px;color:#64748b;margin-top:2px;">'+esc(pack)+'</div>':'')+'</div>'+
        '<div>'+esc(normalizeSpec(item.spec)||item.spec||"-")+'</div><div>'+esc(item.color||"-")+'</div>'+
        '<div style="font-weight:700;color:'+stockColor+'">'+esc(item.stock)+'</div><div>'+reserveHtml+'</div><div>'+esc(item.warehouse||"-")+'</div></div>';
    });
    resultDiv.innerHTML=html+'</div>';
    return;
  }
  var mobile="";
  list.forEach(function(item){
    var imageUrl=location.origin+"/images/"+encodeURIComponent(item.code||"")+".jpg";
    var stockColor=item.stock>10?"#2ecc71":item.stock>0?"#f39c12":"#e74c3c";
    var pack=packLine(item);
    var reserveHtml='<span style="font-size:11px;padding:3px 8px;border-radius:999px;background:#e5e7eb;color:#666;">留货 0</span>';
    if(item.reserved>0){
      reserveHtml='<div style="margin-top:2px;"><span style="font-size:11px;padding:3px 8px;border-radius:999px;background:#ef4444;color:#fff;">留货 '+esc(item.reserved)+'</span>'+(item.reserveDetail?'<div style="margin-top:4px;font-size:12px;color:#c0392b;line-height:1.4;">客户：'+esc(item.reserveDetail)+'</div>':'')+'</div>';
    }
    mobile+='<div class="card" style="display:flex;align-items:center;gap:12px;">'+
      '<div onclick="openModal(\''+imageUrl+'\')"><img src="'+imageUrl+'" style="width:58px;height:58px;border-radius:8px;object-fit:cover;" onerror="this.style.display=\'none\'"></div>'+
      '<div style="flex:1;min-width:0;"><div style="font-weight:600;font-size:15px;">'+esc(item.code)+'</div>'+
      '<div style="font-size:13px;color:#555;margin-top:2px;">'+esc(normalizeSpec(item.spec)||item.spec||"-")+' | 色号 '+esc(item.color||"-")+'</div>'+
      (pack?'<div style="font-size:12px;color:#64748b;margin-top:3px;">'+esc(pack)+'</div>':'')+
      '<div style="margin-top:6px;">'+reserveHtml+'</div></div>'+
      '<div style="text-align:right;flex-shrink:0;"><div style="display:inline-block;font-size:11px;padding:4px 10px;border-radius:999px;background:#eef3f8;color:#2c3e50;font-weight:500;margin-bottom:6px;">'+esc(item.warehouse||"-")+'</div>'+
      '<div style="font-size:16px;font-weight:700;padding:6px 12px;border-radius:10px;background:'+stockColor+';color:#fff;">'+esc(item.stock)+'</div></div></div>';
  });
  resultDiv.innerHTML=mobile;
}
function run(){
  var raw=document.getElementById("searchInput").value.trim();
  var k=raw.toLowerCase();
  var spec=normalizeSpec(raw).toLowerCase();
  if(typeof DATA==="undefined"||!DATA.length){document.getElementById("result").innerHTML="<div style='padding:16px;color:#94a3b8;'>还没有库存数据</div>";return;}
  if(!k){document.getElementById("result").innerHTML="<div style='padding:16px;color:#94a3b8;'>请输入编号或规格</div>";return;}
  var hits=DATA.filter(function(r){
    return String(r.code||"").toLowerCase().indexOf(k)>=0||String(r.spec||"").toLowerCase().indexOf(k)>=0||(spec&&String(r.spec||"").toLowerCase().indexOf(spec)>=0)||String(r.color||"").toLowerCase().indexOf(k)>=0;
  });
  hits.sort(function(a,b){
    var ca=String(a.code||"").toLowerCase(), cb=String(b.code||"").toLowerCase();
    var ea=ca===k?0:(ca.indexOf(k)===0?1:2);
    var eb=cb===k?0:(cb.indexOf(k)===0?1:2);
    return ea-eb||ca.localeCompare(cb,"zh-CN");
  });
  render(hits);
}
document.getElementById("btnSearch").onclick=run;
document.getElementById("searchInput").addEventListener("keydown",function(e){if(e.key==="Enter")run();});
window.openModal=function(src){var m=document.getElementById("imgModal");document.getElementById("modalImg").src=src;m.style.display="flex";};
document.getElementById("imgModal").onclick=function(){this.style.display="none";};
</script>
</body>
</html>
