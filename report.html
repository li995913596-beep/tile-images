<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>卖货分析报表</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/style.css?v=20260818a">
<style>
  .report-wrap { max-width: 960px; margin: 0 auto; padding: 16px; }
  .report-header { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:16px; }
  .report-header h1 { margin:0; font-size:22px; color:#1f2f46; }
  .period-btns { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:14px; }
  .period-btns button { cursor:pointer; }
  .period-btns button.active { background:#2f7dd1; color:#fff; }
  .summary { font-size:15px; font-weight:600; margin-bottom:16px; color:#1f2f46; }
  .chart-box { background:#fafbfd; border-radius:12px; padding:14px; margin-bottom:16px; }
  .chart-box h3 { margin:0 0 10px; font-size:15px; }
  .sort-row { display:flex; gap:8px; align-items:center; margin-bottom:10px; flex-wrap:wrap; }
  .sort-row button { font-size:13px; padding:6px 12px; }
  .sort-row button.active { background:#2f7dd1; color:#fff; }
  table.report-table { width:100%; border-collapse:collapse; min-width:360px; }
  table.report-table th { background:linear-gradient(90deg,#3a8dde,#2f7dd1); color:#fff; padding:10px 12px; text-align:left; }
  table.report-table td { padding:10px 12px; border-bottom:1px solid #eef2f6; }
  .hint { font-size:12px; color:#888; margin-top:20px; }
</style>
</head>
<body>
<header class="app-nav">
  <a class="nav-item" href="index.html">
    <svg viewBox="0 0 24 24"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z"/><path d="M9 21V12h6v9"/></svg>
    <span>库存</span>
  </a>
  <a class="nav-item" href="transit.html">
    <svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><circle cx="12" cy="12" r="3"/></svg>
    <span>在途</span>
  </a>
  <a class="nav-item" href="ship.html">
    <svg viewBox="0 0 24 24"><path d="M1 3h15v13H1z"/><path d="M16 8h4l3 3v5h-7V8z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
    <span>出货</span>
  </a>
  <a class="nav-item" href="boxes.html">
    <svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.3 7L12 12l8.7-5"/><path d="M12 22V12"/></svg>
    <span>纸箱</span>
  </a>
  <a class="nav-item" href="grout.html">
    <svg viewBox="0 0 24 24"><path d="M9 3h6v4H9z"/><path d="M10 7h4v14h-4z"/><path d="M14 11h4l1 3v7h-5v-10z"/></svg>
    <span>美缝</span>
  </a>
  <a class="nav-item active" href="report.html">
    <svg viewBox="0 0 24 24"><path d="M4 19V5"/><path d="M4 19h16"/><path d="M8 17V10"/><path d="M12 17V7"/><path d="M16 17v-4"/></svg>
    <span>看板</span>
  </a>
  <a class="nav-item" href="admin.html">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
    <span>设置</span>
  </a>
</header>

<div class="report-wrap">
  <div class="report-header">
    <h1>出库排行（老板看板）</h1>
  </div>

  <div class="period-btns">
    <button type="button" id="btn_today" onclick="loadReport('today')">今天</button>
    <button type="button" id="btn_week" onclick="loadReport('week')">本周</button>
    <button type="button" id="btn_month" class="active" onclick="loadReport('month')">本月</button>
    <button type="button" id="btn_year" onclick="loadReport('year')">本年</button>
    <span style="color:#888;margin-left:6px;">或</span>
    <input type="date" id="r_start">
    <span>~</span>
    <input type="date" id="r_end">
    <button type="button" onclick="loadReport('custom')">查询</button>
    <span style="color:#888;margin-left:6px;">仓库</span>
    <select id="r_warehouse" onchange="loadReport(window._lastPreset||'month')" style="padding:6px 10px;border-radius:8px;border:1px solid #ddd;">
      <option value="">全部仓库</option>
      <option value="k38">k38</option>
      <option value="k39">k39</option>
      <option value="1">1</option>
      <option value="c9">C9</option>
    </select>
  </div>

  <div id="summary" class="summary">加载中…</div>

  <div class="chart-box">
    <h3>出库 Top 15（柱状图）</h3>
    <canvas id="barChart" height="120"></canvas>
  </div>

  <div class="chart-box" style="max-width:480px;">
    <h3>Top 10 占比（饼图）</h3>
    <canvas id="pieChart" height="200"></canvas>
  </div>

  <div class="sort-row">
    <span style="font-size:13px;color:#555;">排名排序：</span>
    <button type="button" id="sort_qty" class="active" onclick="setSort('qty')">按出库数量</button>
    <button type="button" id="sort_count" onclick="setSort('count')">按出库次数</button>
  </div>

  <div style="overflow-x:auto;">
    <table class="report-table">
      <thead>
        <tr>
          <th>排名</th>
          <th>编号</th>
          <th>出库总量</th>
          <th>出库次数</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <p class="hint">此页面无需登录。数据来自出库日志，仅供查看。</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script type="module" src="js/report.js"></script>
</body>
</html>
