<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>卖货分析报表</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/style.css?v=20260824a">
<style>
  .report-wrap { max-width: 960px; margin: 0 auto; padding: 16px; }
  .report-header { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:16px; }
  .report-header h1 { margin:0; font-size:22px; color:#1f2f46; }
  .period-btns { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:14px; }
  .period-btns button { cursor:pointer; }
  .period-btns button.active { background:#2f7dd1; color:#fff; }
  .summary { font-size:15px; font-weight:600; margin-bottom:16px; color:#1f2f46; }
  .chart-box { background:#fafbfd; border-radius:12px; padding:14px; margin-bottom:16px; }
  .chart-box h3 { margin:0 0 10px; font-size:15px; }
  .sort-row { display:flex; gap:8px; align-items:center; margin-bottom:10px; flex-wrap:wrap; }
  .sort-row button { font-size:13px; padding:6px 12px; }
  .sort-row button.active { background:#2f7dd1; color:#fff; }
  table.report-table { width:100%; border-collapse:collapse; min-width:360px; }
  table.report-table th { background:linear-gradient(90deg,#3a8dde,#2f7dd1); color:#fff; padding:10px 12px; text-align:left; }
  table.report-table td { padding:10px 12px; border-bottom:1px solid #eef2f6; }
  .hint { font-size:12px; color:#888; margin-top:20px; }
</style>
</head>
<body>
<header class="app-nav">
  <a class="nav-item nav-stock" href="index.html">
    <svg viewBox="0 0 24 24"><path d="M12 3L3 9v11a1 1 0 0 0 1 1h5v-7h6v7h5a1 1 0 0 0 1-1V9l-9-6z"/></svg>
    <span>库存</span>
  </a>
  <a class="nav-item nav-transit" href="transit.html">
    <svg viewBox="0 0 24 24"><path d="M3 15.5c0-.8.4-1.5 1-1.9V11a1 1 0 0 1 1-1h2.2l1.1-3.2A2 2 0 0 1 10.2 5.5h3.6a2 2 0 0 1 1.9 1.3L17 10h2a1 1 0 0 1 1 1v2.6c.6.4 1 1.1 1 1.9 0 1.1-.9 2-2 2h-1.1a2.5 2.5 0 0 1-4.8 0H9.9a2.5 2.5 0 0 1-4.8 0H4c-1.1 0-2-.9-2-2zm4.5 1.5a1 1 0 1 0 0-2 1 1 0 0 0 0 2zm9 0a1 1 0 1 0 0-2 1 1 0 0 0 0 2zM10.2 7.5l-1 3h5.6l-1-3h-3.6z"/></svg>
    <span>在途</span>
  </a>
  <a class="nav-item nav-ship" href="ship.html">
    <svg viewBox="0 0 24 24"><path d="M3 7a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v8H3V7zm13 3h2.6a1 1 0 0 1 .8.4l1.9 2.5a1 1 0 0 1 .2.6V15h-5.5V10zM6.5 18.5a1.8 1.8 0 1 0 0-3.6 1.8 1.8 0 0 0 0 3.6zm11 0a1.8 1.8 0 1 0 0-3.6 1.8 1.8 0 0 0 0 3.6z"/></svg>
    <span>出货</span>
  </a>
  <a class="nav-item nav-boxes" href="boxes.html">
    <svg viewBox="0 0 24 24"><path d="M12 2.5L3.5 7v10L12 21.5 20.5 17V7L12 2.5zm0 2.3l6.2 3.3-2.5 1.3-6.2-3.3L12 4.8zM5.3 8.6l6.2 3.3v7.4l-6.2-3.3V8.6zm13.4 0v7.4l-6.2 3.3v-7.4l6.2-3.3z"/></svg>
    <span>纸箱</span>
  </a>
  <a class="nav-item nav-grout" href="grout.html">
    <svg viewBox="0 0 24 24"><path d="M9.5 2.5h5a1 1 0 0 1 1 1V5h-7V3.5a1 1 0 0 1 1-1zM8.5 5h7v2.2l1.3 1.1A3 3 0 0 1 18 10.6V19a2.5 2.5 0 0 1-2.5 2.5h-7A2.5 2.5 0 0 1 6 19v-8.4a3 3 0 0 1 1.2-2.3L8.5 7.2V5zm2 5.5a1 1 0 0 0-1 1v7a1 1 0 1 0 2 0v-7a1 1 0 0 0-1-1zm3 0a1 1 0 0 0-1 1v7a1 1 0 1 0 2 0v-7a1 1 0 0 0-1-1z"/></svg>
    <span>美缝</span>

  <a class="nav-item nav-report active" href="report.html">

    <span>看板</span>
  </a>
  <a class="nav-item nav-admin" href="admin.html">
    <svg viewBox="0 0 24 24"><path d="M12 8.5a3.5 3.5 0 1 1 0 7 3.5 3.5 0 0 1 0-7zm0-6a1 1 0 0 1 1 1v1.1a7.5 7.5 0 0 1 2.3.95l.78-.78a1 1 0 1 1 1.41 1.41l-.78.78c.4.7.7 1.48.95 2.3H19a1 1 0 1 1 0 2h-1.1a7.5 7.5 0 0 1-.95 2.3l.78.78a1 1 0 1 1-1.41 1.41l-.78-.78a7.5 7.5 0 0 1-2.3.95V20a1 1 0 1 1-2 0v-1.1a7.5 7.5 0 0 1-2.3-.95l-.78.78a1 1 0 1 1-1.41-1.41l.78-.78A7.5 7.5 0 0 1 6.1 13.5H5a1 1 0 1 1 0-2h1.1a7.5 7.5 0 0 1 .95-2.3l-.78-.78A1 1 0 1 1 7.68 5.01l.78.78A7.5 7.5 0 0 1 10.76 4.8V3.7a1 1 0 0 1 1-1.2z"/></svg>
    <span>设置</span>
  </a>
</header>

<div class="report-wrap">
  <div class="report-header">
    <h1>出库排行（老板看板）</h1>
  </div>

  <div class="period-btns">
    <button type="button" id="btn_today" onclick="loadReport('today')">今天</button>
    <button type="button" id="btn_week" onclick="loadReport('week')">本周</button>
    <button type="button" id="btn_month" class="active" onclick="loadReport('month')">本月</button>
    <button type="button" id="btn_year" onclick="loadReport('year')">本年</button>
    <span style="color:#888;margin-left:6px;">或</span>
    <input type="date" id="r_start">
    <span>~</span>
    <input type="date" id="r_end">
    <button type="button" onclick="loadReport('custom')">查询</button>
    <span style="color:#888;margin-left:6px;">仓库</span>
    <select id="r_warehouse" onchange="loadReport(window._lastPreset||'month')" style="padding:6px 10px;border-radius:8px;border:1px solid #ddd;">
      <option value="">全部仓库</option>
      <option value="k38">k38</option>
      <option value="k39">k39</option>
      <option value="1">1</option>
      <option value="c9">C9</option>
    </select>
  </div>

  <div id="summary" class="summary">加载中…</div>

  <div class="chart-box">
    <h3>出库 Top 15（柱状图）</h3>
    <canvas id="barChart" height="120"></canvas>
  </div>

  <div class="chart-box" style="max-width:480px;">
    <h3>Top 10 占比（饼图）</h3>
    <canvas id="pieChart" height="200"></canvas>
  </div>

  <div class="sort-row">
    <span style="font-size:13px;color:#555;">排名排序：</span>
    <button type="button" id="sort_qty" class="active" onclick="setSort('qty')">按出库数量</button>
    <button type="button" id="sort_count" onclick="setSort('count')">按出库次数</button>
  </div>

  <div style="overflow-x:auto;">
    <table class="report-table">
      <thead>
        <tr>
          <th>排名</th>
          <th>编号</th>
          <th>出库总量</th>
          <th>出库次数</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <p class="hint">此页面无需登录。数据来自出库日志，仅供查看。</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script type="module" src="js/report.js"></script>
</body>
</html>
