<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>库存管理后台</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
  库存管理后台
  <div style="cursor:pointer" onclick="location.href='index.html'">🏠</div>
</header>

<div class="container">

<div id="loginSection" class="card">
  <h2>管理员登录</h2>
  <input id="email" placeholder="邮箱">
  <input id="password" type="password" placeholder="密码">
  <button id="btnLogin">登录</button>
</div>

<div id="adminSection" style="display:none;">

  <div class="card nav-card">
    <button type="button" onclick="showTab('in')">入库</button>
    <button type="button" onclick="showTab('out')">出库</button>
    <button type="button" onclick="showTab('reserve')">留货</button>
    <button type="button" onclick="showTab('log')">日志</button>
    <button type="button" onclick="showTab('stats')">统计</button>
    <button type="button" onclick="showTab('transit')">在途</button>
    <button type="button" onclick="showTab('files')">文件</button>
    <button type="button" id="btnLogout">退出</button>
  </div>

  <div id="tab_in" class="tab card"></div>
  <div id="tab_out" class="tab card" style="display:none;"></div>
  <div id="tab_reserve" class="tab card" style="display:none;"></div>
  <div id="tab_log" class="tab card" style="display:none;"></div>
  <div id="tab_stats" class="tab card" style="display:none;"></div>

  <div id="tab_transit" class="tab card" style="display:none;padding:16px 18px;">
    <h3 style="margin:0 0 14px;font-size:16px;color:#1f2937;">在途货物管理</h3>
    <div style="font-size:12px;color:#666;margin-bottom:12px;padding:8px 10px;background:#f8fafc;border-radius:8px;">
      一个柜子多种砖：同一柜号新增多行即可。色号可空。Excel 空柜号/提单号会按「同上」自动填充。列表按提单分组表格显示。可按提单/柜号批量删除。提单标题可统一改到港时间。
    </div>

    <div style="padding:14px;border-radius:12px;background:#eff6ff;border:1px solid #bfdbfe;margin-bottom:14px;">
      <div style="font-weight:600;margin-bottom:8px;color:#1e40af;font-size:14px;">📥 Excel 导入装箱单</div>
      <div style="font-size:12px;color:#666;margin-bottom:8px;">
        表头：提单号 柜号 型号 色号 规格 备注 数量 到港/预计到港日期 …（型号必填，色号可空）
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;">
        <input type="file" id="transitExcel" accept=".xlsx,.xls" style="font-size:13px;">
        <button type="button" id="btnTransitImport" style="padding:7px 16px;border:none;border-radius:8px;background:#2563eb;color:#fff;cursor:pointer;font-size:13px;">导入在途</button>
      </div>
    </div>

    <div style="padding:14px;border-radius:12px;background:#f8fafc;border:1px solid #e2e8f0;margin-bottom:14px;">
      <div style="font-weight:600;margin-bottom:8px;color:#1f2937;font-size:14px;">✏️ 手动新增（同柜多型号：柜号填一样，再点新增）</div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;">
        <input id="tm_bl" placeholder="提单号" style="width:120px;padding:6px 8px;border:1px solid #d1d5db;border-radius:6px;">
        <input id="tm_container" placeholder="柜号" style="width:120px;padding:6px 8px;border:1px solid #d1d5db;border-radius:6px;">
        <input id="tm_code" placeholder="型号/编号*" style="width:120px;padding:6px 8px;border:1px solid #d1d5db;border-radius:6px;">
        <input id="tm_color" placeholder="色号(可空)" style="width:90px;padding:6px 8px;border:1px solid #d1d5db;border-radius:6px;">
        <input id="tm_spec" placeholder="规格" style="width:100px;padding:6px 8px;border:1px solid #d1d5db;border-radius:6px;">
        <input id="tm_qty" type="number" placeholder="数量" style="width:80px;padding:6px 8px;border:1px solid #d1d5db;border-radius:6px;">
        <input id="tm_eta" placeholder="预计到港" style="width:120px;padding:6px 8px;border:1px solid #d1d5db;border-radius:6px;">
        <input id="tm_remark" placeholder="备注" style="width:140px;padding:6px 8px;border:1px solid #d1d5db;border-radius:6px;">
        <select id="tm_status" style="padding:6px 8px;border:1px solid #d1d5db;border-radius:6px;">
          <option value="在途">在途</option>
          <option value="已到港">已到港</option>
        </select>
        <button type="button" id="btnTransitAdd" style="padding:7px 16px;border:none;border-radius:8px;background:#16a34a;color:#fff;cursor:pointer;">新增</button>
      </div>
    </div>

    <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px;">
      <input id="transitSearch" placeholder="搜索编号/柜号/提单" style="flex:1;min-width:140px;padding:7px 10px;border:1px solid #d1d5db;border-radius:8px;">
      <select id="transitFilter" style="padding:7px 10px;border:1px solid #d1d5db;border-radius:8px;">
        <option value="active">在途+已到港</option>
        <option value="在途">仅在途</option>
        <option value="已到港">仅已到港</option>
        <option value="history">历史</option>
        <option value="all">全部</option>
      </select>
      <button type="button" id="btnTransitReload" style="padding:7px 14px;border:1px solid #d1d5db;border-radius:8px;background:#fff;cursor:pointer;">刷新</button>
    </div>
    <div id="transitList"></div>
  </div>

  <div id="tab_files" class="tab card" style="display:none;padding:16px 18px;">
    <h3 style="margin:0 0 14px;font-size:16px;color:#1f2937;">文件与图片管理</h3>
    <div style="padding:14px;border-radius:12px;background:#f0fdf4;border:1px solid #bbf7d0;margin-bottom:14px;">
      <div style="font-weight:600;margin-bottom:6px;color:#166534;font-size:14px;">🔑 GitHub Token（只需保存一次）</div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;">
        <input id="gh_token_input" type="password" placeholder="粘贴 GitHub Token"
          style="flex:1;min-width:180px;padding:7px 10px;border:1px solid #d1d5db;border-radius:8px;font-size:13px;">
        <button type="button" id="gh_token_save" style="padding:7px 14px;border:none;border-radius:8px;background:#2f7dd1;color:#fff;cursor:pointer;font-size:13px;">保存 Token</button>
        <a href="https://github.com/settings/tokens?type=beta" target="_blank" style="font-size:12px;color:#2f7dd1;">生成 Token</a>
      </div>
    </div>
    <div style="padding:14px;border-radius:12px;background:#f0fdf4;border:1px solid #bbf7d0;margin-bottom:14px;">
      <div style="font-weight:600;margin-bottom:8px;color:#166534;font-size:14px;">📷 上传 / 替换图片（先搜索再操作）</div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px;">
        <input id="img_search" placeholder="搜索编号或规格" style="flex:1;min-width:160px;padding:7px 10px;border:1px solid #d1d5db;border-radius:8px;font-size:13px;">
        <button type="button" id="img_search_btn" style="padding:7px 16px;border:none;border-radius:8px;background:#16a34a;color:#fff;cursor:pointer;font-size:13px;font-weight:600;">搜索</button>
      </div>
      <div id="img_search_result"></div>
    </div>
    <div style="padding:14px;border-radius:12px;background:#f8fafc;border:1px solid #e2e8f0;">
      <div style="font-weight:600;margin-bottom:10px;color:#1f2937;font-size:14px;">📦 库存文件</div>
      <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;">
        <input type="file" id="excelFile" accept=".xlsx,.xls" style="font-size:13px;">
        <button type="button" onclick="handleImport()" style="padding:7px 16px;border:none;border-radius:8px;background:#2f7dd1;color:#fff;cursor:pointer;font-size:13px;">导入库存</button>
        <button type="button" onclick="exportInventory()" style="padding:7px 16px;border:1px solid #d1d5db;border-radius:8px;background:#fff;color:#374151;cursor:pointer;font-size:13px;">导出当前库存</button>
      </div>
    </div>
  </div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script type="module" src="js/admin.js?v=20260806a"></script>
<script type="module" src="js/image_upload.js?v=20260801f"></script>
<script type="module" src="js/transit_admin.js?v=20260805d"></script>

</body>
</html>
