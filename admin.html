<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>库存管理后台</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
  库存管理后台
  <div style="cursor:pointer" onclick="location.href='index.html'">🏠</div>
</header>

<div class="container">

<div id="loginSection" class="card">
  <h2>管理员登录</h2>
  <input id="email" placeholder="邮箱">
  <input id="password" type="password" placeholder="密码">
  <button id="btnLogin">登录</button>
</div>

<div id="adminSection" style="display:none;">

  <div class="card nav-card">
    <button type="button" onclick="showTab('in')">入库</button>
    <button type="button" onclick="showTab('out')">出库</button>
    <button type="button" onclick="showTab('reserve')">留货</button>
    <button type="button" onclick="showTab('log')">日志</button>
    <button type="button" onclick="showTab('stats')">统计</button>
    <button type="button" onclick="showTab('files')">文件</button>
    <button type="button" id="btnLogout">退出</button>
  </div>

  <div id="tab_in" class="tab card"></div>
  <div id="tab_out" class="tab card" style="display:none;"></div>
  <div id="tab_reserve" class="tab card" style="display:none;"></div>
  <div id="tab_log" class="tab card" style="display:none;"></div>
  <div id="tab_stats" class="tab card" style="display:none;"></div>

  <div id="tab_files" class="tab card" style="display:none;padding:16px 18px;">
    <h3 style="margin:0 0 14px;font-size:16px;color:#1f2937;">文件与图片管理</h3>

    <div style="padding:14px;border-radius:12px;background:#f0fdf4;border:1px solid #bbf7d0;margin-bottom:14px;">
      <div style="font-weight:600;margin-bottom:6px;color:#166534;font-size:14px;">🔑 GitHub Token（上传图片用，只需保存一次）</div>
      <div style="font-size:12px;color:#666;margin-bottom:10px;">
        Token 只存在本机浏览器。上传/替换图片请到「入库」搜索商品后操作。
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;">
        <input id="gh_token_input" type="password" placeholder="粘贴 GitHub Token"
          style="flex:1;min-width:200px;padding:7px 10px;border:1px solid #d1d5db;border-radius:8px;font-size:13px;">
        <button type="button" id="gh_token_save" style="padding:7px 14px;border:none;border-radius:8px;background:#2f7dd1;color:#fff;cursor:pointer;font-size:13px;">保存 Token</button>
        <button type="button" id="gh_token_clear" style="padding:7px 14px;border:1px solid #d1d5db;border-radius:8px;background:#fff;cursor:pointer;font-size:13px;">清除</button>
        <a href="https://github.com/settings/tokens?type=beta" target="_blank" style="font-size:12px;color:#2f7dd1;padding:0 4px;">生成 Token</a>
      </div>
      <div style="font-size:12px;color:#888;margin-top:8px;">Fine-grained：选 tile-images 仓库，Contents = Read and write</div>
    </div>

    <div style="padding:14px;border-radius:12px;background:#f8fafc;border:1px solid #e2e8f0;">
      <div style="font-weight:600;margin-bottom:10px;color:#1f2937;font-size:14px;">📦 库存文件</div>
      <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;">
        <input type="file" id="excelFile" accept=".xlsx,.xls" style="font-size:13px;">
        <button type="button" onclick="handleImport()" style="padding:7px 16px;border:none;border-radius:8px;background:#2f7dd1;color:#fff;cursor:pointer;font-size:13px;">导入库存</button>
        <button type="button" onclick="exportInventory()" style="padding:7px 16px;border:1px solid #d1d5db;border-radius:8px;background:#fff;color:#374151;cursor:pointer;font-size:13px;">导出当前库存</button>
      </div>
    </div>
  </div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script type="module" src="js/admin.js"></script>
<script type="module" src="js/image_upload.js"></script>

</body>
</html>
