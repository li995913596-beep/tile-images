<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>管理员后台</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
</head>

<body>

<div id="loginSection">
  <h2>管理员登录</h2>
  <input id="username" placeholder="用户名">
  <input id="password" type="password" placeholder="密码">
  <button id="btnLogin">登录</button>
</div>

<div id="adminSection" style="display:none;">

  <h2>库存管理后台</h2>

  <div>
    <button onclick="showTab('in')">入库</button>
    <button onclick="showTab('out')">出库</button>
    <button onclick="showTab('reserve')">留货</button>
    <button onclick="showTab('log')">日志</button>
    <button onclick="location.reload()">退出</button>
  </div>

  <hr>

  <!-- 入库 -->
  <div id="tab_in" class="tab">
    <h3>入库</h3>
    <input id="in_search" placeholder="搜索编号或色号">
    <button onclick="searchInventory('in')">搜索</button>
    <div id="in_result"></div>

    <h4>新增库存（如不存在）</h4>
    编号<input id="new_code">
    规格<input id="new_spec">
    色号<input id="new_color">
    仓库<input id="new_warehouse">
    数量<input id="new_qty">
    <button onclick="addNewStock()">新增</button>
  </div>

  <!-- 出库 -->
  <div id="tab_out" class="tab" style="display:none;">
    <h3>出库</h3>
    <input id="out_search" placeholder="搜索编号或色号">
    <button onclick="searchInventory('out')">搜索</button>
    <div id="out_result"></div>
  </div>

  <!-- 留货 -->
  <div id="tab_reserve" class="tab" style="display:none;">
    <h3>留货</h3>
    <input id="reserve_search" placeholder="搜索编号或色号">
    <button onclick="searchInventory('reserve')">搜索</button>
    <div id="reserve_result"></div>

    <h4>全局留货清单</h4>
    <div id="reserveList"></div>
  </div>

  <!-- 日志 -->
  <div id="tab_log" class="tab" style="display:none;">
    <h3>日志</h3>
    <button onclick="downloadLogs()">下载CSV</button>
    <div id="logList"></div>
  </div>

</div>

<script type="module" src="js/admin.js"></script>
</body>
</html>
