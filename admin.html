<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>管理后台</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="navbar">
  <div class="logo">瓷砖库存管理系统</div>
  <div>
    <a href="index.html">库存查询</a>
  </div>
</div>

<div class="container">

<div id="loginSection">
  <h2>管理员登录</h2>
  <input id="email" placeholder="邮箱">
  <input id="password" type="password" placeholder="密码">
  <button id="btnLogin">登录</button>
</div>

<div id="adminSection" style="display:none;">

<h2>后台管理</h2>

<hr>
<h3>搜索库存</h3>
<input id="searchCode" placeholder="输入编号搜索">
<button id="btnSearch">搜索</button>

<div id="searchResult"></div>

<hr>
<h3>操作区</h3>

<div id="selectedInfo"></div>

<input id="operateQty" type="number" placeholder="数量">
<input id="operateCustomer" placeholder="客户（出库时填写）">

<label>
<input type="checkbox" id="operatePaid">
已付款
</label>

<br><br>

<button id="btnIn">入库</button>
<button id="btnOut">出库</button>

<hr>
<h3>操作日志</h3>
<div id="logList"></div>

<br>
<button id="btnLogout">退出登录</button>

</div>

</div>

<script type="module" src="js/admin.js"></script>
</body>
</html>
