<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>库存后台</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div id="loginSection">
  <h2>管理员登录</h2>
  <input id="email" placeholder="邮箱">
  <input id="password" type="password" placeholder="密码">
  <button id="btnLogin">登录</button>
</div>

<div id="adminSection" style="display:none;">

  <h2>库存管理后台</h2>

  <div>
    <button onclick="showTab('in')">入库</button>
    <button onclick="showTab('out')">出库</button>
    <button onclick="showTab('reserve')">留货</button>
    <button onclick="showTab('log')">日志</button>
    <button onclick="location.href='index.html'">返回首页</button>
    <button id="btnLogout">退出</button>
  </div>

  <hr>

  <div id="tab_in" class="tab"></div>
  <div id="tab_out" class="tab" style="display:none;"></div>
  <div id="tab_reserve" class="tab" style="display:none;"></div>
  <div id="tab_log" class="tab" style="display:none;"></div>

</div>

<script type="module" src="js/admin.js"></script>
</body>
</html>
