<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>库存后台</title>
<style>
nav{
  background:#1976d2;
  padding:10px;
}
nav a{
  color:white;
  margin-right:15px;
  text-decoration:none;
}
.card{
  border:1px solid #ccc;
  padding:10px;
  margin:5px;
}
</style>
</head>
<body>

<nav>
  <a href="index.html">返回首页</a>
  <a href="#">库存后台</a>
</nav>

<h2>管理员登录</h2>
<div id="loginSection">
  <input id="email" placeholder="邮箱">
  <input id="password" type="password" placeholder="密码">
  <button id="btnLogin">登录</button>
</div>

<div id="adminSection" style="display:none;">

<h3>Excel 导入库存</h3>
<input type="file" id="excelFile">

<hr>

<h3>搜索库存</h3>
<input id="searchCode" placeholder="编号或色号">
<button id="btnSearch">搜索</button>
<div id="searchResult"></div>

<hr>

<h3>入库 / 出库</h3>
<div id="selectedInfo" style="color:green;"></div>
<input id="operateQty" type="number" placeholder="数量">
<input id="operateCustomer" placeholder="客户">
<select id="operatePaid">
<option value="">付款状态</option>
<option value="已付款">已付款</option>
<option value="未付款">未付款</option>
</select>
<button id="btnIn">入库</button>
<button id="btnOut">出库</button>

<hr>

<h3>留货</h3>
<input id="reserveCustomer" placeholder="客户">
<input id="reserveQty" type="number" placeholder="数量">
<button id="btnReserve">确认留货</button>

<hr>

<h3>全局留货清单</h3>
<div id="reserveList"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script type="module" src="js/admin.js"></script>
</body>
</html>
