<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title data-i18n="title.admin">库存管理后台</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/style.css?v=20260902f">
<script src="js/i18n.js?v=20260902f"></script>
<script src="js/lang_bind.js?v=20260902g"></script>
</head>
<body>
<header>
  <span data-i18n="admin.header">库存管理后台</span>
  <div style="cursor:pointer" onclick="location.href='index.html'">🏠</div>
</header>
<div id="langSwitch" class="lang-switch">
  <div class="lang-switch-inner">
    <button type="button" data-lang="zh"><span class="lang-flag">🇨🇳</span>中文</button>
    <button type="button" data-lang="en"><span class="lang-flag">🇬🇧</span>EN</button>
    <button type="button" data-lang="th"><span class="lang-flag">🇹🇭</span>ไทย</button>
  </div>
</div>
<div class="container">
<div id="loginSection" class="card">
  <h2 data-i18n="admin.login">管理员登录</h2>
  <input id="email" placeholder="邮箱" data-i18n-placeholder="admin.email">
  <input id="password" type="password" placeholder="密码" data-i18n-placeholder="admin.password">
  <button id="btnLogin" data-i18n="admin.signin">登录</button>
</div>
<div id="adminSection" style="display:none;">
  <div class="card nav-card">
    <button type="button" onclick="showTab('in')" data-i18n="admin.in">入库</button>
    <button type="button" onclick="showTab('out')" data-i18n="admin.out">出库</button>
    <button type="button" onclick="showTab('reserve')" data-i18n="admin.reserve">留货</button>
    <button type="button" onclick="showTab('log')" data-i18n="admin.log">日志</button>
    <button type="button" onclick="showTab('stats')" data-i18n="admin.stats">统计</button>
    <button type="button" onclick="showTab('transit')" data-i18n="admin.transit">在途</button>
    <button type="button" onclick="showTab('files')" data-i18n="admin.files">文件</button>
    <button type="button" onclick="showTab('ship')" data-i18n="admin.ship">出货计划</button>
    <button type="button" onclick="showTab('boxes')" data-i18n="admin.boxes">纸箱</button>
    <button type="button" onclick="showTab('grout')" data-i18n="admin.grout">美缝剂</button>
    <button type="button" id="btnLogout" data-i18n="admin.logout">退出</button>
  </div>
  <div id="tab_in" class="tab card"></div>
  <div id="tab_out" class="tab card" style="display:none;"></div>
  <div id="tab_ship" class="tab card" style="display:none;padding:16px 18px;"></div>
  <div id="tab_boxes" class="tab card" style="display:none;padding:16px 18px;"></div>
  <div id="tab_grout" class="tab card" style="display:none;padding:16px 18px;"></div>
  <div id="tab_reserve" class="tab card" style="display:none;"></div>
  <div id="tab_log" class="tab card" style="display:none;"></div>
  <div id="tab_stats" class="tab card" style="display:none;"></div>
  <div id="tab_transit" class="tab card" style="display:none;padding:16px 18px;">
    <h3 style="margin:0 0 14px;font-size:16px;color:#1f2937;">在途货物管理</h3>
    <div style="font-size:12px;color:#666;margin-bottom:12px;padding:8px 10px;background:#f8fafc;border-radius:8px;">一个柜子多种砖：同一柜号新增多行即可。色号可空。列表按提单分组。可按提单/柜号批量删除。</div>
    <div id="transitList"></div>
  </div>
  <div id="tab_files" class="tab card" style="display:none;padding:16px 18px;"></div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script type="module" src="js/admin.js?v=20260821b"></script>
<script type="module" src="js/ship_plan.js?v=20260819b"></script>
<script type="module" src="js/out_from_plan.js?v=20260819b"></script>
<script type="module" src="js/admin_log_tools.js?v=20260821b"></script>
<script type="module" src="js/image_upload.js?v=20260801f"></script>
<script type="module" src="js/transit_admin.js?v=20260813a"></script>
<script type="module" src="js/transit_inbound.js?v=20260815g"></script>
<script type="module" src="js/boxes.js?v=20260815m"></script>
<script type="module" src="js/grout.js?v=20260817a"></script>
</body>
</html>
