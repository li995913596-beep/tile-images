<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title data-i18n="title.transit">在途货物</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/style.css?v=20260902e">
<script src="js/i18n.js?v=20260902e"></script>
<style>
  .transit-filters { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:12px; }
  .transit-filters input, .transit-filters select {
    padding:8px 10px; border:1px solid #d1d5db; border-radius:8px; font-size:14px;
  }
  .empty { color:#666; padding:20px; text-align:center; }
  .bl-section { background:#fff; border:1px solid #e5e7eb; border-radius:12px; margin-bottom:12px; overflow:hidden; }
  .bl-head { display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:12px 14px; cursor:pointer; background:#f8fafc; user-select:none; }
  .bl-head:hover { background:#f1f5f9; }
  .bl-head.open { background:#eff6ff; border-bottom:1px solid #e5e7eb; }
  .bl-toggle { font-size:12px; color:#64748b; width:14px; }
  .bl-title { font-weight:700; font-size:15px; color:#1e293b; }
  .bl-meta { font-size:12px; color:#64748b; }
  .bl-eta { font-size:13px; font-weight:700; color:#b45309; background:#fef3c7; padding:2px 8px; border-radius:6px; }
  .bl-updated { font-size:12px; color:#64748b; }
  .tip-line { display:block; margin:6px 0 0; font-size:12px; color:#9a3412; line-height:1.5; }
  .stale-banner { display:none; margin:8px 0 0; padding:10px 12px; background:#fff7ed; border:1px solid #fed7aa; border-radius:10px; color:#9a3412; font-size:13px; line-height:1.5; }
  .bl-body { padding:0; overflow-x:auto; }
  .bl-table { width:100%; border-collapse:collapse; font-size:13px; min-width:640px; }
  .bl-table th { text-align:left; padding:8px 10px; background:#f1f5f9; color:#475569; font-weight:600; border-bottom:1px solid #e2e8f0; white-space:nowrap; }
  .bl-table td { padding:8px 10px; border-bottom:1px solid #f1f5f9; vertical-align:middle; color:#334155; }
  .bl-table tr:hover td { background:#fafafa; }
  .bl-table tr.row-new-container td { border-top:1px solid #e2e8f0; }
  .td-code { font-weight:600; color:#0f172a; }
  .td-cno { color:#64748b; font-size:12px; white-space:nowrap; }
  .td-qty { text-align:right; min-width:72px; }
  .qty-pill { display:inline-block; font-size:15px; font-weight:700; padding:5px 12px; border-radius:10px; color:#fff; min-width:36px; text-align:center; }
  .td-remark { max-width:140px; color:#64748b; font-size:12px; }
  .td-res { color:#9a3412; font-size:12px; max-width:160px; }
  .badge { display:inline-block; padding:2px 8px; border-radius:999px; font-size:12px; font-weight:600; }
  .badge-zt { background:#dbeafe; color:#1d4ed8; }
  .badge-dg { background:#fef3c7; color:#b45309; }
  .badge-rk { background:#e5e7eb; color:#374151; }
  .badge-qx { background:#fee2e2; color:#b91c1c; }
</style>
</head>
<body>
<header class="app-nav">
  <a class="nav-item nav-stock" href="index.html"><svg viewBox="0 0 24 24"><path d="M12 3L3 9v11a1 1 0 0 0 1 1h5v-7h6v7h5a1 1 0 0 0 1-1V9l-9-6z"/></svg><span data-i18n="nav.stock">库存</span></a>
  <a class="nav-item nav-transit active" href="transit.html"><svg viewBox="0 0 24 24"><path d="M3 15.5c0-.8.4-1.5 1-1.9V11a1 1 0 0 1 1-1h2.2l1.1-3.2A2 2 0 0 1 10.2 5.5h3.6a2 2 0 0 1 1.9 1.3L17 10h2a1 1 0 0 1 1 1v2.6c.6.4 1 1.1 1 1.9 0 1.1-.9 2-2 2h-1.1a2.5 2.5 0 0 1-4.8 0H9.9a2.5 2.5 0 0 1-4.8 0H4c-1.1 0-2-.9-2-2zm4.5 1.5a1 1 0 1 0 0-2 1 1 0 0 0 0 2zm9 0a1 1 0 1 0 0-2 1 1 0 0 0 0 2zM10.2 7.5l-1 3h5.6l-1-3h-3.6z"/></svg><span data-i18n="nav.transit">在途</span></a>
  <a class="nav-item nav-ship" href="ship.html"><svg viewBox="0 0 24 24"><path d="M3 7a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v8H3V7zm13 3h2.6a1 1 0 0 1 .8.4l1.9 2.5a1 1 0 0 1 .2.6V15h-5.5V10zM6.5 18.5a1.8 1.8 0 1 0 0-3.6 1.8 1.8 0 0 0 0 3.6zm11 0a1.8 1.8 0 1 0 0-3.6 1.8 1.8 0 0 0 0 3.6z"/></svg><span data-i18n="nav.ship">出货</span></a>
  <a class="nav-item nav-boxes" href="boxes.html"><svg viewBox="0 0 24 24"><path d="M12 2.5L3.5 7v10L12 21.5 20.5 17V7L12 2.5zm0 2.3l6.2 3.3-2.5 1.3-6.2-3.3L12 4.8zM5.3 8.6l6.2 3.3v7.4l-6.2-3.3V8.6zm13.4 0v7.4l-6.2 3.3v-7.4l6.2-3.3z"/></svg><span data-i18n="nav.boxes">纸箱</span></a>
  <a class="nav-item nav-grout" href="grout.html"><svg viewBox="0 0 24 24"><path d="M9.5 2.5h5a1 1 0 0 1 1 1V5h-7V3.5a1 1 0 0 1 1-1zM8.5 5h7v2.2l1.3 1.1A3 3 0 0 1 18 10.6V19a2.5 2.5 0 0 1-2.5 2.5h-7A2.5 2.5 0 0 1 6 19v-8.4a3 3 0 0 1 1.2-2.3L8.5 7.2V5zm2 5.5a1 1 0 0 0-1 1v7a1 1 0 1 0 2 0v-7a1 1 0 0 0-1-1zm3 0a1 1 0 0 0-1 1v7a1 1 0 1 0 2 0v-7a1 1 0 0 0-1-1z"/></svg><span data-i18n="nav.grout">美缝</span></a>
  <a class="nav-item nav-report" href="report.html"><svg viewBox="0 0 24 24"><path d="M4 19.5a1 1 0 0 1-1-1V5a1 1 0 1 1 2 0v12.5H19a1 1 0 1 1 0 2H4zm4.5-3a1 1 0 0 1-1-1V11a1 1 0 1 1 2 0v4.5a1 1 0 0 1-1 1zm4.5 0a1 1 0 0 1-1-1V8a1 1 0 1 1 2 0v7.5a1 1 0 0 1-1 1zm4.5 0a1 1 0 0 1-1-1V12.5a1 1 0 1 1 2 0V15.5a1 1 0 0 1-1 1z"/></svg><span data-i18n="nav.report">看板</span></a>
  <a class="nav-item nav-admin" href="admin.html"><svg viewBox="0 0 24 24"><path d="M12 8.5a3.5 3.5 0 1 1 0 7 3.5 3.5 0 0 1 0-7zm0-6a1 1 0 0 1 1 1v1.1a7.5 7.5 0 0 1 2.3.95l.78-.78a1 1 0 1 1 1.41 1.41l-.78.78c.4.7.7 1.48.95 2.3H19a1 1 0 1 1 0 2h-1.1a7.5 7.5 0 0 1-.95 2.3l.78.78a1 1 0 1 1-1.41 1.41l-.78-.78a7.5 7.5 0 0 1-2.3.95V20a1 1 0 1 1-2 0v-1.1a7.5 7.5 0 0 1-2.3-.95l-.78.78a1 1 0 1 1-1.41-1.41l.78-.78A7.5 7.5 0 0 1 6.1 13.5H5a1 1 0 1 1 0-2h1.1a7.5 7.5 0 0 1 .95-2.3l-.78-.78A1 1 0 1 1 7.68 5.01l.78.78A7.5 7.5 0 0 1 10.76 4.8V3.7a1 1 0 0 1 1-1.2z"/></svg><span data-i18n="nav.admin">设置</span></a>
</header>
<div id="langSwitch" class="lang-switch">
  <button type="button" data-lang="zh">中文</button>
  <button type="button" data-lang="en">EN</button>
  <button type="button" data-lang="th">ไทย</button>
</div>
<div class="container">
  <div class="card" style="margin-bottom:12px;">
    <h2 style="margin:0 0 4px;font-size:18px;"><span data-i18n="h.transit">在途货物</span></h2>
    <div id="tTip" class="tip-line" data-i18n="tip.transit">数据由管理员手动更新；若更新时间超过 1 周，信息可能不准确，请询问管理员。</div>
    <div id="tStale" class="stale-banner"></div>
    <div class="transit-filters" style="margin-top:12px;">
      <input id="tSearch" placeholder="搜索编号 / 柜号 / 提单号" data-i18n-placeholder="ph.searchTransit" style="flex:1;min-width:180px;">
      <select id="tStatus">
        <option value="active" data-i18n="opt.active">在途 + 已到港</option>
        <option value="在途" data-i18n="opt.inTransit">仅在途</option>
        <option value="已到港" data-i18n="opt.arrived">仅已到港</option>
        <option value="history" data-i18n="opt.history">历史（已入库/取消）</option>
        <option value="all" data-i18n="opt.all">全部</option>
      </select>
      <button type="button" id="tBtnSearch" style="padding:8px 14px;border:none;border-radius:8px;background:#2f7dd1;color:#fff;cursor:pointer;"><span data-i18n="btn.search">查询</span></button>
      <button type="button" id="tBtnAll" style="padding:8px 14px;border:1px solid #d1d5db;border-radius:8px;background:#fff;cursor:pointer;"><span data-i18n="btn.showAll">显示全部</span></button>
    </div>
    <div id="tHint" style="font-size:12px;color:#888;margin-top:6px;"></div>
  </div>
  <div id="tResult"></div>
</div>
<script type="module" src="js/transit.js?v=20260902e"></script>
</body>
</html>
